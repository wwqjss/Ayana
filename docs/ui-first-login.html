<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Ayana · 首次登录</title>
<style>
:root {
  --bg: #0f1115;
  --card: #1a1d24;
  --ink: #e8eaed;
  --dim: #8b919a;
  --ok: #3dd68c;
  --bad: #f07178;
  --warn: #e5c07b;
  --acc: #6cb6ff;
  --line: rgba(255,255,255,.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg); color: var(--ink); min-height: 100vh;
}
.muted { color: var(--dim); }
.small { font-size: 12px; }
.error { color: var(--bad); min-height: 1.2em; margin-top: 8px; font-size: 13px; }
.login-wrap {
  min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
}
.login-card {
  width: 100%; max-width: 400px; padding: 32px;
  background: var(--card); border-radius: 14px; border: 1px solid var(--line);
}
.login-card h1 { font-size: 24px; margin-bottom: 4px; }
.login-card > .muted { margin-bottom: 4px; }
.login-card label { display: block; margin: 14px 0 0; font-size: 13px; color: var(--dim); }
.login-card input {
  width: 100%; margin-top: 6px; padding: 10px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: rgba(255,255,255,.04); color: var(--ink);
  font-size: 14px;
}
.login-card input:focus { outline: none; border-color: var(--acc); }
.login-card input::placeholder { color: rgba(139,145,154,.55); }
.btn {
  padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line);
  background: rgba(255,255,255,.04); color: var(--ink); cursor: pointer; font-size: 13px;
}
.btn.primary { background: rgba(108,182,255,.18); border-color: rgba(108,182,255,.4); }
.btn.ghost { background: transparent; }
.form-row {
  margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap;
}
fieldset.setup {
  border: 1px solid var(--line); border-radius: 10px;
  padding: 12px 14px 14px; margin: 16px 0 0;
}
fieldset.setup legend {
  color: var(--dim); font-size: 12px; padding: 0 6px;
}
.brand-tag {
  text-align: center; margin-bottom: 18px;
  font-size: 12px; letter-spacing: .12em; color: var(--dim); text-transform: uppercase;
}
.brand-tag b { color: var(--acc); letter-spacing: .04em; font-size: 14px; }
</style>
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" onsubmit="return false">
      <div class="brand-tag"><b>Ayana</b> · 运维控制台 · 首次登录</div>
      <h1>修改密码</h1>
      <p class="muted small">首次登录或口令已重置，请设置新密码后继续。完成前无法使用控制台功能。</p>

      <label>新密码
        <input type="password" autocomplete="new-password" placeholder="至少 10 位">
      </label>
      <label>确认新密码
        <input type="password" autocomplete="new-password" placeholder="再次输入新密码">
      </label>
      <p class="muted small" style="margin-top:8px">新密码至少 10 位；建议混合大小写、数字与符号。</p>

      <fieldset class="setup">
        <legend>监控接入（可稍后配置）</legend>
        <p class="muted small" style="margin-bottom:4px">
          独立新实例需要指向自备的 Prometheus 才能展示主机资源。原生业务检查不依赖 Prometheus。
        </p>
        <label>Prometheus 地址
          <input type="url" placeholder="http://127.0.0.1:9090" autocomplete="off">
        </label>
        <label>Alertmanager 地址
          <input type="url" placeholder="http://127.0.0.1:9093" autocomplete="off">
        </label>
        <p class="muted small" style="margin-top:10px">可留空跳过；之后可在「资源 → 一键接入监控」继续配置。</p>
      </fieldset>

      <p class="error"></p>
      <div class="form-row">
        <button type="submit" class="btn primary">确认修改</button>
        <button type="button" class="btn ghost">退出登录</button>
      </div>
    </form>
  </div>
</body>
</html>
