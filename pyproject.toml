[project]
name = "ayana"
version = "0.8.2"
description = "Ayana — native agent operations, monitoring and evidence-backed recovery"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9", "cryptography>=42", "paramiko>=3.4"]

[project.scripts]
ayana = "ayana.main:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ayana*"]

[tool.setuptools.package-data]
ayana = ["static/*", "static/**/*"]
