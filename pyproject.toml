[project]
name = "ayana"
version = "0.1.0"
description = "Ayana — OneBot v11 reverse WS server for NapCat (ops platform)"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9"]

[project.scripts]
ayana = "ayana.main:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ayana*"]
