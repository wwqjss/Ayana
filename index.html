<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ayana v0.1.0</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --ink:#e8eaed; --dim:#8b919a; --ok:#3dd68c; --bad:#f07178; --acc:#6cb6ff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { background:var(--card); border-radius:16px; padding:36px 40px; max-width:440px; width:100%; box-shadow:0 8px 32px rgba(0,0,0,.4); }
  h1 { font-size:22px; font-weight:600; margin-bottom:4px; }
  .ver { color:var(--dim); font-size:13px; margin-bottom:28px; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid rgba(255,255,255,.06); }
  .row:last-child { border-bottom:none; }
  .label { color:var(--dim); font-size:13px; }
  .val { font-size:14px; font-weight:500; font-variant-numeric:tabular-nums; }
  .badge { display:inline-block; padding:2px 10px; border-radius:20px; font-size:12px; font-weight:600; }
  .badge.ok { background:rgba(61,214,140,.15); color:var(--ok); }
  .badge.bad { background:rgba(240,113,120,.15); color:var(--bad); }
  .footer { margin-top:24px; text-align:center; color:var(--dim); font-size:11px; }
  button { margin-top:20px; width:100%; padding:10px; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.04); color:var(--ink); border-radius:10px; font-size:13px; cursor:pointer; transition:background .15s; }
  button:hover { background:rgba(108,182,255,.12); border-color:var(--acc); }
</style>
</head>
<body>
<div class="card">
  <h1>Ayana</h1>
  <div class="ver">v0.1.0 &middot; OneBot v11 Reverse WS</div>

  <div class="row"><span class="label">服务状态</span><span id="st" class="badge ok">…</span></div>
  <div class="row"><span class="label">NapCat 连接</span><span id="nc" class="badge ok">…</span></div>
  <div class="row"><span class="label">连接数</span><span id="conn" class="val">-</span></div>
  <div class="row"><span class="label">运行时长</span><span id="up" class="val">-</span></div>

  <button onclick="refresh()">刷新</button>
  <div class="footer">数据来源 :6200/health &middot; 自动每 10s 刷新</div>
</div>
<script>
async function refresh() {
  try {
    const r = await fetch('http://' + location.hostname + ':6200/health');
    const d = await r.json();
    document.getElementById('st').textContent = 'ok';
    document.getElementById('st').className = 'badge ok';
    document.getElementById('nc').textContent = d.napcat_connected ? '已连接' : '未连接';
    document.getElementById('nc').className = 'badge ' + (d.napcat_connected ? 'ok' : 'bad');
    document.getElementById('conn').textContent = d.connections;
    const s = d.uptime_sec;
    document.getElementById('up').textContent = (s < 60 ? s + ' 秒' : Math.floor(s/60) + ' 分 ' + (s%60) + ' 秒');
  } catch (e) {
    document.getElementById('st').textContent = '不可达';
    document.getElementById('st').className = 'badge bad';
    document.getElementById('nc').textContent = '-';
    document.getElementById('nc').className = 'badge bad';
    document.getElementById('conn').textContent = '-';
    document.getElementById('up').textContent = '-';
  }
}
refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
